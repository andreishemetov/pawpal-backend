version: "3.9"

services:
  redis:
    image: redis:7
    container_name: pawpal-redis
    ports:
      - "6379:6379"
  db:
    image: postgres:15
    container_name: pawpal-db
    environment:
      POSTGRES_USER: pawpal
      POSTGRES_PASSWORD: pawpal_pass
      POSTGRES_DB: pawpal_dev
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawpal -d pawpal_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate
    container_name: pawpal-migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      [
        "-path=/migrations",
        "-database=postgres://pawpal:pawpal_pass@db:5432/pawpal_dev?sslmode=disable",
        "up",
      ]

  api:
    build: .
    container_name: pawpal-api
    command: ["/app/api"]
    depends_on:
      - db
      - migrate
    environment:
      DATABASE_URL: postgres://pawpal:pawpal_pass@db:5432/pawpal_dev?sslmode=disable
      JWT_SECRET: very-secret-key
      HTTP_ADDR: :8080
      REDIS_ADDR: redis:6379
    ports:
      - "8080:8080"

  worker:
    build: .
    container_name: pawpal-worker
    command: ["/app/worker"]
    depends_on:
      - db
      - migrate
    environment:
      DATABASE_URL: postgres://pawpal:pawpal_pass@db:5432/pawpal_dev?sslmode=disable
      JWT_SECRET: very-secret-key

volumes:
  db-data:
