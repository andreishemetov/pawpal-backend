basePath: /
definitions:
  data.Pet:
    properties:
      age:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      type:
        type: string
      visits:
        type: integer
    type: object
  errs.ErrorResponse:
    properties:
      error:
        type: string
    type: object
info:
  contact: {}
  description: API for managing pets in PawPal.
  title: PawPal API
  version: "1.0"
paths:
  /pets:
    get:
      description: Get pets with pagination and filtering
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Pet type
        in: query
        name: type
        type: string
      - description: Search by name
        in: query
        name: q
        type: string
      - description: Sort field
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errs.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errs.ErrorResponse'
      summary: List pets
      tags:
      - pets
    post:
      consumes:
      - application/json
      description: Create a new pet
      parameters:
      - description: Pet payload
        in: body
        name: pet
        required: true
        schema:
          $ref: '#/definitions/data.Pet'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/data.Pet'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errs.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errs.ErrorResponse'
      summary: Create a pet
      tags:
      - pets
  /pets/{id}:
    get:
      parameters:
      - description: Pet ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/data.Pet'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errs.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errs.ErrorResponse'
      summary: Get pet by ID
      tags:
      - pets
swagger: "2.0"
