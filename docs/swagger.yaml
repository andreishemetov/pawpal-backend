basePath: /
definitions:
  data.CountResponse:
    properties:
      count:
        type: integer
    type: object
  data.Pet:
    properties:
      age:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      type:
        type: string
      user_id:
        type: integer
      visits:
        type: integer
    type: object
  data.PetsListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/data.Pet'
        type: array
      meta:
        properties:
          limit:
            type: integer
          page:
            type: integer
          total:
            type: integer
        type: object
    type: object
  data.Reminder:
    properties:
      channel:
        type: string
      error_message:
        type: string
      id:
        type: integer
      message:
        type: string
      pet_id:
        type: integer
      processed:
        type: boolean
      remind_at:
        type: string
      sent_at:
        description: |-
          SentAt is a nullable DB field: nil maps to NULL (not sent yet).
          omitempty keeps sent_at out of JSON when it is nil.
        type: string
      user_id:
        type: integer
    type: object
  data.User:
    properties:
      email:
        type: string
      id:
        type: integer
      role:
        type: string
    type: object
  errs.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  handler.authRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  handler.refreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  service.AuthTokens:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
    url: https://example.com/support
  description: API for managing pets in PawPal.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://example.com/terms/
  title: PawPal API
  version: "1.0"
paths:
  /login:
    post:
      consumes:
      - application/json
      description: Authenticate user credentials and return access/refresh tokens
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.authRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.AuthTokens'
        "400":
          description: invalid json
          schema:
            type: string
        "401":
          description: invalid credentials
          schema:
            type: string
      summary: Log in a user
      tags:
      - auth
  /logout:
    post:
      consumes:
      - application/json
      description: Revoke the provided refresh token
      parameters:
      - description: Refresh token payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.refreshRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: invalid json
          schema:
            type: string
        "500":
          description: failed to logout
          schema:
            type: string
      summary: Log out a user
      tags:
      - auth
  /pets:
    get:
      description: Get pets with pagination and filtering
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Pet type
        in: query
        name: type
        type: string
      - description: Search by name
        in: query
        name: q
        type: string
      - description: Sort field
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/data.PetsListResponse'
        "500":
          description: failed to load pets
          schema:
            type: string
      summary: List pets
      tags:
      - pets
    post:
      consumes:
      - application/json
      description: Create a new pet
      parameters:
      - description: Pet payload
        in: body
        name: pet
        required: true
        schema:
          $ref: '#/definitions/data.Pet'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/data.Pet'
        "400":
          description: name is required
          schema:
            type: string
        "405":
          description: Method not allowed
          schema:
            type: string
        "500":
          description: failed to create pet
          schema:
            type: string
      summary: Create a pet
      tags:
      - pets
  /pets/{id}:
    delete:
      parameters:
      - description: Pet ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: invalid id
          schema:
            type: string
        "404":
          description: pet not found
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Delete pet by ID
      tags:
      - pets
    get:
      parameters:
      - description: Pet ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/data.Pet'
        "400":
          description: invalid id
          schema:
            type: string
        "404":
          description: pet not found
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Get pet by ID
      tags:
      - pets
    put:
      parameters:
      - description: Pet ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/data.Pet'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errs.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errs.ErrorResponse'
      summary: Update pet by ID
      tags:
      - pets
  /pets/count:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/data.CountResponse'
        "500":
          description: failed to load pets
          schema:
            type: string
      summary: Get count of pets
      tags:
      - pets
  /refresh:
    post:
      consumes:
      - application/json
      description: Exchange a valid refresh token for a new token pair
      parameters:
      - description: Refresh token payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.AuthTokens'
        "400":
          description: invalid json
          schema:
            type: string
        "401":
          description: invalid refresh token
          schema:
            type: string
      summary: Refresh access token
      tags:
      - auth
  /reminders:
    post:
      consumes:
      - application/json
      description: Create a new reminder for the current authenticated user
      parameters:
      - description: Reminder payload
        in: body
        name: reminder
        required: true
        schema:
          $ref: '#/definitions/data.Reminder'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/data.Reminder'
        "400":
          description: remind_at is required (use RFC3339, e.g. 2026-03-30T15:00:00Z)
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "500":
          description: failed to create reminder
          schema:
            type: string
      summary: Create a reminder
      tags:
      - reminders
  /signup:
    post:
      consumes:
      - application/json
      description: Register a user by email and password
      parameters:
      - description: Signup payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.authRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/data.User'
        "400":
          description: email and password required
          schema:
            type: string
        "500":
          description: failed to signup
          schema:
            type: string
      summary: Sign up a new user
      tags:
      - auth
schemes:
- http
- https
swagger: "2.0"
