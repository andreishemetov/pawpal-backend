basePath: /
definitions:
  data.CountResponse:
    properties:
      count:
        type: integer
    type: object
  data.Pet:
    properties:
      age:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      type:
        type: string
      visits:
        type: integer
    type: object
  data.PetsListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/data.Pet'
        type: array
      meta:
        properties:
          limit:
            type: integer
          page:
            type: integer
          total:
            type: integer
        type: object
    type: object
  errs.ErrorResponse:
    properties:
      error:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
    url: https://example.com/support
  description: API for managing pets in PawPal.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://example.com/terms/
  title: PawPal API
  version: "1.0"
paths:
  /pets:
    get:
      description: Get pets with pagination and filtering
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Pet type
        in: query
        name: type
        type: string
      - description: Search by name
        in: query
        name: q
        type: string
      - description: Sort field
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/data.PetsListResponse'
        "500":
          description: failed to load pets
          schema:
            type: string
      summary: List pets
      tags:
      - pets
    post:
      consumes:
      - application/json
      description: Create a new pet
      parameters:
      - description: Pet payload
        in: body
        name: pet
        required: true
        schema:
          $ref: '#/definitions/data.Pet'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/data.Pet'
        "400":
          description: name is required
          schema:
            type: string
        "405":
          description: Method not allowed
          schema:
            type: string
        "500":
          description: failed to create pet
          schema:
            type: string
      summary: Create a pet
      tags:
      - pets
  /pets/{id}:
    delete:
      parameters:
      - description: Pet ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: invalid id
          schema:
            type: string
        "404":
          description: pet not found
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Delete pet by ID
      tags:
      - pets
    get:
      parameters:
      - description: Pet ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/data.Pet'
        "400":
          description: invalid id
          schema:
            type: string
        "404":
          description: pet not found
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Get pet by ID
      tags:
      - pets
    put:
      parameters:
      - description: Pet ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/data.Pet'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errs.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errs.ErrorResponse'
      summary: Update pet by ID
      tags:
      - pets
  /pets/count:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/data.CountResponse'
        "500":
          description: failed to load pets
          schema:
            type: string
      summary: Get count of pets
      tags:
      - pets
schemes:
- http
- https
swagger: "2.0"
